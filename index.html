<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parlays">
<title>Parlay Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: scoreboard ticket stack — summary strip on top, one card per parlay, one row per leg. */
:root {
  --bg: #eceff3; --surface: #ffffff; --surface-2: #f4f6f9; --ink: #131c26; --muted: #5a6776; --line: #d8dee6;
  --accent: #c77b00; --win: #18884a; --win-bg: #e3f4ea; --lose: #c93838; --lose-bg: #fbe7e7; --tie: #8a6d00; --tie-bg: #fbf2d6;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1016; --surface: #141b23; --surface-2: #1b242e; --ink: #e7ecf1; --muted: #8b99a8; --line: #26313d;
    --accent: #ffb22e; --win: #43cf7f; --win-bg: #12301f; --lose: #ff6d6d; --lose-bg: #3a1717; --tie: #f2c94c; --tie-bg: #352c10;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.4 var(--body);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; padding-block: 18px; }
.num { font-variant-numeric: tabular-nums; }
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 700 34px/1 var(--display); letter-spacing: .01em; margin: 0; text-transform: uppercase; }
h1 span { color: var(--accent); }
.updated { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 10px; }
button.refresh {
  font: 600 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
button.refresh:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
.dot.on { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }

.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; text-decoration: none; color: inherit; }
.sum .label { font: 600 12px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sum .big { font: 700 26px/1 var(--display); }
.sum .sub { font-size: 12px; color: var(--muted); }
@media (max-width: 520px) { .summary { grid-template-columns: 1fr; } .sum { grid-template-columns: 1fr auto; align-items: center; } .sum .sub { grid-column: 1 / -1; } }

.pill { font: 700 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px 4px; border-radius: 4px; white-space: nowrap; }
.pill.live { background: var(--accent); color: var(--bg); }
.pill.pending { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.dead { background: var(--lose-bg); color: var(--lose); }
.pill.won { background: var(--win-bg); color: var(--win); }

.parlay { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.parlay.dead .leg { opacity: .55; }
.phead { padding: 14px 16px 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.prow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ptitle { font: 700 22px/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; margin: 0; }
.ptitle .odds { color: var(--accent); margin-left: 6px; }
.pmeta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.pmeta b { color: var(--ink); font-weight: 600; }
.pmeta b.pay { color: var(--win); }
.segs { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; }
.seg { height: 6px; border-radius: 3px; background: var(--line); }
.seg.won { background: var(--win); } .seg.lost { background: var(--lose); }
.seg.winning { background: var(--win); opacity: .45; } .seg.losing { background: var(--lose); opacity: .45; } .seg.tied { background: var(--tie); opacity: .6; }

.leg { padding: 12px 16px 14px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.leg:last-child { border-bottom: 0; }
.lhead { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.mark { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font: 700 13px var(--body); }
.mark.won { background: var(--win); border-color: var(--win); color: var(--surface); }
.mark.lost { background: var(--lose); border-color: var(--lose); color: var(--surface); }
.mark.winning { border-color: var(--win); } .mark.losing { border-color: var(--lose); } .mark.tied { border-color: var(--tie); }
.mark.pending { border-color: var(--accent); }
.pick { min-width: 0; }
.pick .name { font: 600 17px/1.15 var(--display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.pick .type { font-size: 12px; color: var(--muted); }
.lodds { font: 600 17px var(--display); color: var(--muted); }
.state { font: 700 12px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px 3px; border-radius: 4px; }
.state.won, .state.winning { background: var(--win-bg); color: var(--win); }
.state.lost, .state.losing { background: var(--lose-bg); color: var(--lose); }
.state.tied { background: var(--tie-bg); color: var(--tie); }
.state.pending { background: var(--surface-2); color: var(--muted); }

.game { margin-left: 36px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.gtop { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.gtop .status { font-weight: 600; color: var(--ink); }
.gtop .status.live { color: var(--accent); }
.box { width: 100%; border-collapse: collapse; }
.box td, .box th { padding: 2px 0; text-align: center; font-size: 13px; }
.box th { font-weight: 500; color: var(--muted); font-size: 11px; }
.box td.team { text-align: left; white-space: nowrap; }
.box td.team img { width: 20px; height: 20px; vertical-align: middle; margin-right: 6px; object-fit: contain; }
.box td.team .abbr { font: 600 15px var(--display); letter-spacing: .03em; }
.box td.team .rec { color: var(--muted); font-size: 11px; margin-left: 4px; }
.box tr.mine td.team .abbr { color: var(--accent); }
.box td.tot { font: 700 20px/1 var(--display); width: 40px; }
.box td.per { color: var(--muted); width: 26px; }
.box tr.loser td.tot { color: var(--muted); }
.extras { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; align-items: center; }
.extras .k { color: var(--muted); }
.wp { display: grid; gap: 4px; }
.wp .bar { height: 8px; border-radius: 4px; background: var(--lose-bg); overflow: hidden; }
.wp .fill { height: 100%; background: var(--win); border-radius: 4px; transition: width .6s; }
.wp .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.wp .lbl b { color: var(--ink); }
.last { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; }
.diamond { display: inline-flex; align-items: center; gap: 8px; }
.diamond svg { width: 34px; height: 26px; }
.diamond .base { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.diamond .base.on { fill: var(--accent); stroke: var(--accent); }
.outs i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); margin-left: 3px; }
.outs i.on { background: var(--accent); border-color: var(--accent); }
.err { background: var(--lose-bg); color: var(--lose); padding: 10px 12px; border-radius: 10px; font-size: 13px; }
footer { color: var(--muted); font-size: 12px; text-align: center; }
@media (max-width: 420px) { .game { margin-left: 0; } .phead, .leg { padding-inline: 12px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Parlay <span>Board</span></h1>
    <div class="updated"><i class="dot" id="dot"></i><span id="updated" class="num">Loading scores…</span><button class="refresh" id="refresh" type="button">Refresh</button></div>
  </header>
  <section class="summary" id="summary"></section>
  <div id="err"></div>
  <main id="parlays" class="wrap" style="padding:0"></main>
  <footer>Scores from ESPN. Refreshes every 30 s while a game is live, every 2 min otherwise. Free picks pay winnings only.</footer>
</div>
<script>
// Edit this list to change the board. event = ESPN game id; pick = ESPN team abbreviation.
const PARLAYS = [
  { title: "NHL 4-Pick", odds: "+628", wager: "$10 free pick", toPay: 62.80, ref: "0b465f85", legs: [
    { sport: "hockey/nhl", date: "20261004", event: "401892443", pick: "NYR", name: "NY Rangers", odds: -118 },
    { sport: "hockey/nhl", date: "20261004", event: "401891778", pick: "FLA", name: "FLA Panthers", odds: -132 },
    { sport: "hockey/nhl", date: "20261004", event: "401892444", pick: "VGK", name: "VGK Knights", odds: -283 },
    { sport: "hockey/nhl", date: "20261004", event: "401891824", pick: "SEA", name: "SEA Kraken", odds: -152 },
  ]},
  { title: "Sunday Mix 4-Pick", odds: "+411", wager: "$10 free pick", toPay: 41.10, ref: "", legs: [
    { sport: "football/nfl", date: "20261004", event: "401872978", pick: "DET", name: "DET Lions", odds: -194 },
    { sport: "basketball/wnba", date: "20261004", event: "401918296", pick: "GS", name: "GSV Valkyries", odds: -360 },
    { sport: "baseball/mlb", date: "20261004", event: "401908014", pick: "LAD", name: "LAD Dodgers", odds: -207 },
    { sport: "baseball/mlb", date: "20261005", event: "401907986", pick: "NYY", name: "NYY Yankees", odds: -128 },
  ]},
  { title: "College Football 4-Pick", odds: "+257", wager: "$10 free pick", toPay: 25.70, ref: "e40e3cfb", legs: [
    { sport: "football/college-football", date: "20261006", event: "401871090", pick: "TROY", name: "Troy", odds: -397 },
    { sport: "football/college-football", date: "20261007", event: "401871051", pick: "JXST", name: "Jacksonville State", odds: -152 },
    { sport: "football/college-football", date: "20261007", event: "401871066", pick: "FIU", name: "Florida International", odds: -213 },
    { sport: "football/college-football", date: "20261008", event: "401870766", pick: "LIB", name: "Liberty", odds: -576 },
  ]},
];

const BASE = "https://site.api.espn.com/apis/site/v2/sports/";
const events = {};   // event id -> ESPN event object
const urlOf = l => `${BASE}${l.sport}/scoreboard?dates=${l.date}` + (l.sport.includes("college") ? "&groups=80&limit=300" : "");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtOdds = o => (o > 0 ? "+" : "") + o;
const implied = o => o < 0 ? -o / (-o + 100) : 100 / (o + 100);
const money = n => "$" + n.toFixed(2);

function legInfo(leg) {
  const ev = events[leg.event];
  if (!ev) return { state: "pending", label: "No data" };
  const comp = ev.competitions[0], st = ev.status.type;
  const mine = comp.competitors.find(c => c.team.abbreviation === leg.pick) || comp.competitors[0];
  const opp = comp.competitors.find(c => c !== mine);
  const ms = +mine.score || 0, os = +opp.score || 0;
  let state, label;
  if (/POSTPONED|CANCELED|SUSPENDED/.test(st.name)) { state = "pending"; label = st.description; }
  else if (st.state === "post") { state = mine.winner ? "won" : opp.winner ? "lost" : "tied"; label = { won: "Hit", lost: "Lost", tied: "Push" }[state]; }
  else if (st.state === "in") { state = ms > os ? "winning" : ms < os ? "losing" : "tied"; label = { winning: `Up ${ms - os}`, losing: `Down ${os - ms}`, tied: "Tied" }[state]; }
  else { state = "pending"; label = "Not started"; }
  // Live win probability when ESPN has it (NFL, MLB, college football); otherwise null.
  const p = comp.situation?.lastPlay?.probability;
  const wp = st.state === "in" && p ? (mine.homeAway === "home" ? p.homeWinPercentage : p.awayWinPercentage) : null;
  return { ev, comp, st, mine, opp, state, label, wp, live: st.state === "in" };
}

function parlayInfo(p) {
  const infos = p.legs.map(legInfo);
  const won = infos.filter(i => i.state === "won").length;
  const dead = infos.some(i => i.state === "lost");
  const status = dead ? "dead" : won === p.legs.length ? "won" : infos.some(i => i.live) ? "live" : "pending";
  // ponytail: chance = product of live win% (or the line's implied % with vig) per open leg; rough, not a model.
  const chance = dead ? 0 : infos.reduce((acc, i, k) => acc * (i.state === "won" ? 1 : i.wp ?? implied(p.legs[k].odds)), 1);
  return { infos, won, status, chance };
}

function teamRow(c, comp, isMine, sport, showPer) {
  const per = showPer ? (c.linescores || []).map(l => `<td class="per num">${esc(l.displayValue)}</td>`).join("") : "";
  const mlb = sport.includes("baseball") && comp.status?.type?.state !== "pre" ? `<td class="per num">${esc(c.hits ?? "")}</td><td class="per num">${esc(c.errors ?? "")}</td>` : "";
  const rec = c.records?.[0]?.summary || c.record?.[0]?.summary || "";
  const loser = comp.status?.type?.state === "post" && c.winner === false;
  return `<tr class="${isMine ? "mine" : ""} ${loser ? "loser" : ""}">
    <td class="team"><img src="${esc(c.team.logo)}" alt="" loading="lazy"><span class="abbr">${esc(c.team.abbreviation)}</span><span class="rec num">${esc(rec)}</span></td>
    ${per}${mlb}<td class="tot num">${comp.status?.type?.state === "pre" ? "" : esc(c.score)}</td></tr>`;
}

function extras(leg, i) {
  const out = [], s = i.comp.situation || {};
  const sport = leg.sport;
  if (i.st.state === "pre") {
    const tv = i.comp.broadcast || i.comp.broadcasts?.[0]?.names?.join(", ");
    if (tv) out.push(`<span><span class="k">TV</span> ${esc(tv)}</span>`);
    const probs = i.comp.competitors.map(c => c.probables?.[0]?.athlete?.shortName ? `${c.team.abbreviation}: ${c.probables[0].athlete.shortName}` : "").filter(Boolean);
    if (probs.length) out.push(`<span><span class="k">Starters</span> ${esc(probs.join(" · "))}</span>`);
    out.push(`<span><span class="k">Line implies</span> ${Math.round(implied(leg.odds) * 100)}%</span>`);
  }
  if (i.live && sport.includes("football")) {
    const poss = i.comp.competitors.find(c => c.team.id === s.possession);
    if (poss) out.push(`<span><span class="k">Ball</span> <b>${esc(poss.team.abbreviation)}</b></span>`);
    if (s.downDistanceText) out.push(`<span>${esc(s.downDistanceText)}${s.isRedZone ? " · <b style='color:var(--lose)'>Red zone</b>" : ""}</span>`);
  }
  if (i.live && sport.includes("baseball")) {
    const b = k => s[k] ? "on" : "";
    out.push(`<span class="diamond"><svg viewBox="0 0 34 26" aria-label="Runners on base"><rect class="base ${b("onSecond")}" x="12.5" y="2" width="8" height="8" transform="rotate(45 16.5 6)"/><rect class="base ${b("onThird")}" x="3" y="11" width="8" height="8" transform="rotate(45 7 15)"/><rect class="base ${b("onFirst")}" x="22" y="11" width="8" height="8" transform="rotate(45 26 15)"/></svg><span class="num">${s.balls ?? 0}-${s.strikes ?? 0}</span><span class="outs">${[0, 1, 2].map(n => `<i class="${n < (s.outs || 0) ? "on" : ""}"></i>`).join("")}</span></span>`);
    if (s.pitcher?.athlete) out.push(`<span><span class="k">P</span> ${esc(s.pitcher.athlete.shortName)}</span>`);
    if (s.batter?.athlete) out.push(`<span><span class="k">AB</span> ${esc(s.batter.athlete.shortName)}</span>`);
  }
  if ((i.live || i.st.state === "post") && sport.includes("hockey")) {
    // Shots on goal = opponent goalie saves + own goals.
    const sv = c => +(c.statistics || []).find(x => x.name === "saves")?.displayValue || 0;
    out.push(`<span><span class="k">Shots</span> <span class="num">${esc(i.mine.team.abbreviation)} ${sv(i.opp) + (+i.mine.score || 0)} – ${sv(i.mine) + (+i.opp.score || 0)} ${esc(i.opp.team.abbreviation)}</span></span>`);
  }
  return out.length ? `<div class="extras">${out.join("")}</div>` : "";
}

function legHtml(leg, i) {
  const icon = { won: "✓", lost: "✕" }[i.state] || "";
  let game = `<div class="game"><div class="err">Couldn't load this game yet.</div></div>`;
  if (i.ev) {
    const sport = leg.sport, comp = i.comp;
    const start = new Date(i.ev.date);
    const when = i.st.state === "pre"
      ? start.toLocaleString([], { weekday: "short", month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" })
      : i.st.shortDetail;
    const showPer = !sport.includes("baseball") && i.st.state !== "pre";
    const ordered = [...comp.competitors].sort((a, b) => (a.homeAway === "away" ? -1 : 1));
    const nPer = Math.max(0, ...ordered.map(c => (c.linescores || []).length));
    const heads = (showPer ? Array.from({ length: nPer }, (_, k) => `<th>${sport.includes("hockey") ? (k < 3 ? "P" + (k + 1) : k === 3 ? "OT" : "SO") : k < 4 ? "Q" + (k + 1) : "OT"}</th>`).join("") : "")
      + (sport.includes("baseball") && i.st.state !== "pre" ? "<th>H</th><th>E</th>" : "");
    const wp = i.wp != null ? `<div class="wp"><div class="lbl"><span>Win probability</span><b class="num">${esc(i.mine.team.abbreviation)} ${Math.round(i.wp * 100)}%</b></div><div class="bar"><div class="fill" style="width:${(i.wp * 100).toFixed(1)}%"></div></div></div>` : "";
    const last = i.live && comp.situation?.lastPlay?.text ? `<div class="last">${esc(comp.situation.lastPlay.text)}</div>` : "";
    game = `<div class="game">
      <div class="gtop"><span class="status ${i.live ? "live" : ""} num">${esc(when)}</span><span>${esc(comp.venue?.fullName || "")}</span></div>
      <table class="box"><thead><tr><th></th>${heads}<th>${i.st.state === "pre" ? "" : "T"}</th></tr></thead><tbody>
        ${ordered.map(c => teamRow(c, comp, c === i.mine, sport, showPer)).join("")}
      </tbody></table>
      ${wp}${extras(leg, i)}${last}
    </div>`;
  }
  return `<div class="leg">
    <div class="lhead">
      <span class="mark ${i.state}">${icon}</span>
      <div class="pick"><div class="name">${esc(leg.name)}</div><div class="type">Moneyline <span class="num">${fmtOdds(leg.odds)}</span></div></div>
      <span class="state ${i.state}">${esc(i.label)}</span>
    </div>
    ${game}
  </div>`;
}

function render() {
  const all = PARLAYS.map(parlayInfo);
  $("summary").innerHTML = PARLAYS.map((p, k) => {
    const a = all[k];
    return `<a class="sum" href="#p${k}"><span class="label">${esc(p.title)}</span>
      <span class="big num">${a.won}/${p.legs.length} <span class="pill ${a.status}">${{ live: "Live", pending: "Pending", dead: "Dead", won: "Cashed" }[a.status]}</span></span>
      <span class="sub num">${a.status === "dead" ? "No payout" : `Pays ${money(p.toPay)} · ${(a.chance * 100).toFixed(0)}% est.`}</span></a>`;
  }).join("");
  $("parlays").innerHTML = PARLAYS.map((p, k) => {
    const a = all[k];
    return `<article class="parlay ${a.status}" id="p${k}">
      <div class="phead">
        <div class="prow"><h2 class="ptitle">${esc(p.title)}<span class="odds num">${esc(p.odds)}</span></h2>
          <span class="pill ${a.status}">${{ live: "Live", pending: "Open", dead: "Dead", won: "Cashed" }[a.status]}</span></div>
        <div class="segs" style="--n:${p.legs.length}">${a.infos.map(i => `<span class="seg ${i.state}"></span>`).join("")}</div>
        <div class="pmeta num"><span>Legs hit <b>${a.won} of ${p.legs.length}</b></span><span>Wager <b>${esc(p.wager)}</b></span><span>To pay <b class="pay">${money(p.toPay)}</b></span>${a.status === "dead" ? "" : `<span>Chance to cash <b>${(a.chance * 100).toFixed(0)}%</b> est.</span>`}${p.ref ? `<span>Pick ID <b>${esc(p.ref)}</b></span>` : ""}</div>
      </div>
      ${p.legs.map((l, j) => legHtml(l, a.infos[j])).join("")}
    </article>`;
  }).join("");
}

let timer, loadedOnce = false;
async function refresh() {
  clearTimeout(timer);
  // After the first load, skip scoreboards whose legs are all settled.
  const urls = [...new Set(PARLAYS.flatMap(p => p.legs)
    .filter(l => !loadedOnce || events[l.event]?.status?.type?.state !== "post")
    .map(urlOf))];
  const fails = [];
  await Promise.all(urls.map(async u => {
    try {
      const r = await fetch(u, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      for (const e of (await r.json()).events || []) events[e.id] = e;
    } catch (e) { fails.push(u); }
  }));
  loadedOnce = true;
  render();
  const anyLive = Object.values(events).some(e => e.status.type.state === "in" && PARLAYS.some(p => p.legs.some(l => l.event === e.id)));
  $("dot").classList.toggle("on", anyLive);
  $("updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
  $("err").innerHTML = fails.length ? `<div class="err">Couldn't reach ESPN for ${fails.length} scoreboard${fails.length > 1 ? "s" : ""}. Retrying automatically, or tap Refresh.</div>` : "";
  timer = setTimeout(refresh, anyLive ? 30000 : 120000);
}
$("refresh").addEventListener("click", refresh);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
render();
refresh();
</script>
</body>
</html>
